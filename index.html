<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SuperChat</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-base: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-hover: #30363d;
    --border: #30363d;
    --border-subtle: #21262d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #238636;
    --accent-hover: #2ea043;
    --accent-glow: rgba(35,134,54,0.15);
    --danger: #da3633;
    --warning: #d29922;
    --link: #58a6ff;
    --radius: 6px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  .screen { display: none; height: 100vh; width: 100%; }
  .screen.active { display: flex; }

  #screen-gate {
    align-items: center;
    justify-content: center;
    background: var(--bg-base);
    position: relative;
    overflow: hidden;
  }
  #screen-gate::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(35,134,54,0.08) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .gate-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    width: 380px;
    position: relative;
    z-index: 1;
  }
  .gate-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .gate-logo svg { color: var(--accent-hover); }
  .gate-logo h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .gate-logo span { color: var(--accent-hover); }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus { border-color: var(--accent-hover); }
  .form-group input::placeholder { color: var(--text-muted); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
  .form-error.show { display: block; }

  .avatar-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .avatar-option {
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: var(--bg-tertiary);
    transition: border-color 0.15s, transform 0.1s;
  }
  .avatar-option:hover { transform: scale(1.1); }
  .avatar-option.selected { border-color: var(--accent-hover); }

  #screen-app { flex-direction: row; height: 100vh; }

  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
  }
  .sidebar-header span { color: var(--accent-hover); }
  .sidebar-section {
    padding: 12px 8px 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .channel-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: var(--radius);
    margin: 1px 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    transition: all 0.1s;
  }
  .channel-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .channel-item.active { background: var(--bg-hover); color: var(--text-primary); }
  .channel-hash { color: var(--text-muted); font-size: 16px; font-weight: 300; }

  .sidebar-user {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-status { font-size: 11px; color: var(--accent-hover); }
  .logout-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.1s;
  }
  .logout-btn:hover { color: var(--danger); }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-base);
  }
  .chat-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-base);
  }
  .chat-header .channel-hash { font-size: 20px; }
  .chat-header h3 { font-size: 15px; font-weight: 600; }
  .chat-header .desc { font-size: 12px; color: var(--text-muted); margin-left: 4px; }

  .messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .messages-container::-webkit-scrollbar { width: 4px; }
  .messages-container::-webkit-scrollbar-track { background: transparent; }
  .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-group {
    display: flex;
    gap: 12px;
    padding: 4px 6px;
    border-radius: var(--radius);
    transition: background 0.1s;
  }
  .msg-group:hover { background: var(--bg-secondary); }
  .msg-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-content { flex: 1; min-width: 0; }
  .msg-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .msg-author { font-size: 14px; font-weight: 600; }
  .msg-time { font-size: 11px; color: var(--text-muted); }
  .msg-text {
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.5;
    word-break: break-word;
  }
  .msg-img {
    max-width: 300px;
    max-height: 300px;
    border-radius: var(--radius);
    margin-top: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  .day-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 8px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
  }
  .day-divider::before, .day-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-subtle);
  }

  .welcome-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
  }
  .welcome-msg h3 { font-size: 22px; margin-bottom: 8px; }
  .welcome-msg p { font-size: 14px; color: var(--text-muted); }

  .input-area { padding: 12px 20px 20px; background: var(--bg-base); }
  .input-box {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 12px;
    transition: border-color 0.15s;
  }
  .input-box:focus-within { border-color: var(--bg-hover); }
  .msg-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 4px 0;
  }
  .msg-input::placeholder { color: var(--text-muted); }
  .input-actions { display: flex; gap: 4px; align-items: center; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius);
    transition: color 0.1s, background 0.1s;
    display: flex;
  }
  .icon-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
  .icon-btn.send { color: var(--accent-hover); }
  .icon-btn.send:hover { color: #3fb950; background: var(--accent-glow); }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-hover);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay {
    position: fixed; inset: 0;
    background: var(--bg-base);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 999;
  }
  .loading-overlay p { color: var(--text-secondary); font-size: 14px; }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-primary);
    z-index: 9999;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: var(--accent); }
  .toast.error { border-color: var(--danger); }

  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius); }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 50%;
    width: 36px; height: 36px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }

  .tab-switcher {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 3px;
  }
  .tab-btn {
    flex: 1;
    padding: 7px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab-btn.active { background: var(--bg-secondary); color: var(--text-primary); }

  #file-input { display: none; }
  .upload-preview {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .upload-preview.show { display: flex; }
  .upload-preview img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
  .upload-cancel { margin-left: auto; cursor: pointer; color: var(--danger); font-size: 18px; line-height: 1; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p>Connecting...</p>
</div>

<!-- Gate Screen -->
<div class="screen" id="screen-gate">
  <div class="gate-card">
    <div class="gate-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h1>Super<span>Chat</span></h1>
    </div>

    <div class="tab-switcher">
      <button class="tab-btn active" onclick="switchTab('login')">Sign in</button>
      <button class="tab-btn" onclick="switchTab('register')">Create account</button>
    </div>

    <div id="form-login">
      <div class="form-group">
        <label>Gate Password</label>
        <input type="password" id="gate-pw" placeholder="Enter invite password"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your account password"/>
      </div>
      <div class="form-error" id="login-error"></div>
      <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">Sign in</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Gate Password</label>
        <input type="password" id="reg-gate-pw" placeholder="Enter invite password"/>
      </div>
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="reg-name" placeholder="How others see you" maxlength="24"/>
      </div>
      <div class="form-group">
        <label>Choose your avatar</label>
        <div class="avatar-picker" id="avatar-picker"></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters"/>
      </div>
      <div class="form-error" id="reg-error"></div>
      <button class="btn btn-primary" id="reg-btn" onclick="handleRegister()">Create account</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div class="screen" id="screen-app">
  <div class="sidebar">
    <div class="sidebar-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent-hover)">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h2>Super<span>Chat</span></h2>
    </div>
    <div class="sidebar-section">Channels</div>
    <div class="channel-item active" onclick="selectChannel('general','General chat for everyone')">
      <span class="channel-hash">#</span> general
    </div>
    <div class="channel-item" onclick="selectChannel('random','Random stuff & memes')">
      <span class="channel-hash">#</span> random
    </div>
    <div class="channel-item" onclick="selectChannel('github','GitHub links & PRs')">
      <span class="channel-hash">#</span> github
    </div>
    <div class="channel-item" onclick="selectChannel('showcase','Show off your projects')">
      <span class="channel-hash">#</span> showcase
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar">😊</div>
      <div class="user-info">
        <div class="user-name" id="sidebar-name">Loading...</div>
        <div class="user-status">● online</div>
      </div>
      <button class="logout-btn" onclick="handleLogout()" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <span class="channel-hash">#</span>
      <h3 id="channel-name">general</h3>
      <span class="desc" id="channel-desc">General chat for everyone</span>
    </div>
    <div class="messages-container" id="messages"></div>
    <div class="upload-preview" id="upload-preview">
      <img id="preview-thumb" src="" alt=""/>
      <span id="preview-name"></span>
      <span class="upload-cancel" onclick="cancelUpload()">×</span>
    </div>
    <div class="input-area">
      <div class="input-box">
        <textarea class="msg-input" id="msg-input" placeholder="Message #general" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <div class="input-actions">
          <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)"/>
          <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Upload image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>
          <button class="icon-btn send" onclick="sendMessage()" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightbox-img" src="" alt=""/>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, where, deleteDoc, doc, setDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// ── CONFIG ──────────────────────────────────────────────
const GATE_PASSWORD = "superchat12";
const MAX_IMG_MB = 2;

const firebaseConfig = {
  apiKey: "AIzaSyDLmTXM0nYlhlnEA-AqKVRVre_yP34CXiU",
  authDomain: "fart-poo-67.firebaseapp.com",
  projectId: "fart-poo-67",
  storageBucket: "fart-poo-67.firebasestorage.app",
  messagingSenderId: "458085597965",
  appId: "1:458085597965:web:bea9eb0eda5b17b797a644"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// ── STATE ────────────────────────────────────────────────
let currentUser = null;
let currentUserProfile = null;
let currentChannel = 'general';
let unsubMessages = null;
let pendingFile = null;

const AVATARS = ['😊','😎','🦊','🐧','🦄','🐸','🐉','🦋','🦁','🐙','🌸','⚡','🔥','🌿','💜'];

// ── HELPERS ──────────────────────────────────────────────
window.showToast = function(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2800);
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}
function clearError(id) {
  document.getElementById(id).classList.remove('show');
}

// ── AVATAR PICKER ────────────────────────────────────────
const picker = document.getElementById('avatar-picker');
let selectedAvatar = AVATARS[0];
AVATARS.forEach((a, i) => {
  const div = document.createElement('div');
  div.className = 'avatar-option' + (i === 0 ? ' selected' : '');
  div.textContent = a;
  div.onclick = () => {
    document.querySelectorAll('.avatar-option').forEach(d => d.classList.remove('selected'));
    div.classList.add('selected');
    selectedAvatar = a;
  };
  picker.appendChild(div);
});

// ── TABS ─────────────────────────────────────────────────
window.switchTab = function(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (tab === 'login') === (i === 0)));
};

// ── AUTH ─────────────────────────────────────────────────
window.handleLogin = async function() {
  clearError('login-error');
  const gate = document.getElementById('gate-pw').value;
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  if (gate !== GATE_PASSWORD) return showError('login-error', 'Incorrect gate password.');
  if (!email || !pw) return showError('login-error', 'Fill in all fields.');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    showError('login-error', friendlyError(e.code));
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};

window.handleRegister = async function() {
  clearError('reg-error');
  const gate = document.getElementById('reg-gate-pw').value;
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pw = document.getElementById('reg-password').value;
  if (gate !== GATE_PASSWORD) return showError('reg-error', 'Incorrect gate password.');
  if (!name) return showError('reg-error', 'Enter a display name.');
  if (!email || !pw) return showError('reg-error', 'Fill in all fields.');
  if (pw.length < 6) return showError('reg-error', 'Password must be at least 6 characters.');
  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Creating...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, avatar: selectedAvatar, email, createdAt: serverTimestamp()
    });
  } catch(e) {
    showError('reg-error', friendlyError(e.code));
    btn.disabled = false; btn.textContent = 'Create account';
  }
};

window.handleLogout = async function() {
  if (unsubMessages) unsubMessages();
  await signOut(auth);
};

function friendlyError(code) {
  const map = {
    'auth/email-already-in-use': 'That email is already registered.',
    'auth/invalid-email': 'Invalid email address.',
    'auth/weak-password': 'Password is too weak.',
    'auth/user-not-found': 'No account with that email.',
    'auth/wrong-password': 'Wrong password.',
    'auth/invalid-credential': 'Wrong email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again later.',
  };
  return map[code] || 'Something went wrong. Try again.';
}

// ── AUTH STATE ───────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      currentUserProfile = snap.data();
      document.getElementById('sidebar-name').textContent = currentUserProfile.name;
      document.getElementById('sidebar-avatar').textContent = currentUserProfile.avatar;
      document.getElementById('msg-input').placeholder = `Message #${currentChannel}`;
    }
    hideLoading();
    showScreen('screen-app');
    loadChannel(currentChannel);
    cleanOldMessages();
  } else {
    currentUser = null;
    currentUserProfile = null;
    if (unsubMessages) unsubMessages();
    hideLoading();
    showScreen('screen-gate');
  }
});

// ── CHANNELS ─────────────────────────────────────────────
window.selectChannel = function(ch, desc) {
  currentChannel = ch;
  document.getElementById('channel-name').textContent = ch;
  document.getElementById('channel-desc').textContent = desc;
  document.getElementById('msg-input').placeholder = `Message #${ch}`;
  document.querySelectorAll('.channel-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim() === ch);
  });
  loadChannel(ch);
};

function loadChannel(ch) {
  if (unsubMessages) unsubMessages();
  document.getElementById('messages').innerHTML = '';
  const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
  const q = query(
    collection(db, 'channels', ch, 'messages'),
    where('createdAt', '>=', oneWeekAgo),
    orderBy('createdAt', 'asc')
  );
  let lastDate = null;
  unsubMessages = onSnapshot(q, snap => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const data = change.doc.data();
        const ts = data.createdAt?.toDate ? data.createdAt.toDate() : new Date();
        const dateLabel = ts.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
        if (dateLabel !== lastDate) {
          lastDate = dateLabel;
          addDivider(dateLabel);
        }
        appendMessage(data, ts);
      }
    });
    if (snap.empty) {
      document.getElementById('messages').innerHTML = `
        <div class="welcome-msg">
          <h3># ${ch}</h3>
          <p>This is the beginning of #${ch}. Say hi!</p>
        </div>`;
    }
    scrollBottom();
  });
}

function addDivider(label) {
  const div = document.createElement('div');
  div.className = 'day-divider';
  div.textContent = label;
  document.getElementById('messages').appendChild(div);
}

function appendMessage(data, ts) {
  const container = document.getElementById('messages');
  const wm = container.querySelector('.welcome-msg');
  if (wm) wm.remove();

  const timeStr = ts.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'msg-group';
  let imgHtml = '';
  if (data.imageUrl) {
    imgHtml = `<img class="msg-img" src="${data.imageUrl}" alt="image" onclick="openLightbox('${data.imageUrl}')"/>`;
  }
  div.innerHTML = `
    <div class="msg-avatar">${data.avatar || '😊'}</div>
    <div class="msg-content">
      <div class="msg-meta">
        <span class="msg-author">${escHtml(data.author)}</span>
        <span class="msg-time">${timeStr}</span>
      </div>
      ${data.text ? `<div class="msg-text">${escHtml(data.text)}</div>` : ''}
      ${imgHtml}
    </div>`;
  container.appendChild(div);
}

function scrollBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

// ── SENDING ──────────────────────────────────────────────
window.handleKey = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
};

window.sendMessage = async function() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !pendingFile) return;
  if (!currentUser || !currentUserProfile) return;

  input.value = '';
  input.style.height = 'auto';

  let imageUrl = null;
  if (pendingFile) {
    try {
      const storageRef = ref(storage, `chat-images/${currentChannel}/${Date.now()}_${pendingFile.name}`);
      const snap = await uploadBytes(storageRef, pendingFile);
      imageUrl = await getDownloadURL(snap.ref);
    } catch(e) {
      showToast('Image upload failed: ' + e.message, 'error');
      return;
    }
    cancelUpload();
  }

  try {
    await addDoc(collection(db, 'channels', currentChannel, 'messages'), {
      text: text || '',
      imageUrl,
      author: currentUserProfile.name,
      avatar: currentUserProfile.avatar,
      uid: currentUser.uid,
      createdAt: serverTimestamp()
    });
  } catch(e) {
    showToast('Failed to send: ' + e.message, 'error');
  }
};

// ── FILE UPLOAD ──────────────────────────────────────────
window.handleFileSelect = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > MAX_IMG_MB * 1024 * 1024) {
    showToast(`Image too large. Max ${MAX_IMG_MB}MB.`, 'error');
    e.target.value = '';
    return;
  }
  pendingFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('preview-thumb').src = ev.target.result;
    document.getElementById('preview-name').textContent = file.name;
    document.getElementById('upload-preview').classList.add('show');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

window.cancelUpload = function() {
  pendingFile = null;
  document.getElementById('upload-preview').classList.remove('show');
  document.getElementById('preview-thumb').src = '';
};

// ── CLEANUP ──────────────────────────────────────────────
async function cleanOldMessages() {
  const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
  const channels = ['general', 'random', 'github', 'showcase'];
  for (const ch of channels) {
    const q = query(
      collection(db, 'channels', ch, 'messages'),
      where('createdAt', '<', oneWeekAgo)
    );
    const snap = await getDocs(q);
    snap.forEach(d => deleteDoc(doc(db, 'channels', ch, 'messages', d.id)));
  }
}

// ── LIGHTBOX ─────────────────────────────────────────────
window.openLightbox = function(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('show');
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('show');
};

// ── UTILS ────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
